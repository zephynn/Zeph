<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="zephyn — Roblox developer. Links to Roblox, YouTube, and TikTok." />
    <title>zephyn</title>

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="zephyn" />
    <meta property="og:url" content="https://www.zephyn.dev/" />
    <meta property="og:title" content="zephyn" />
    <meta property="og:description" content="Roblox developer. Links to Roblox, YouTube, and TikTok." />
    <meta property="og:image" content="https://www.zephyn.dev/og-image.png" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="zephyn" />
    <meta name="twitter:description" content="Roblox developer. Links to Roblox, YouTube, and TikTok." />
    <meta name="twitter:image" content="https://www.zephyn.dev/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=DM+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="page">
      <div class="blobs" id="blobs" aria-hidden="true">
        <div class="blob blob--a"></div>
        <div class="blob blob--b"></div>
        <div class="blob blob--c"></div>
      </div>
      <div class="bg-avatar" id="bg-avatar" aria-hidden="true"></div>

      <main class="content">
        <section class="hero">
          <div class="hero__top">
            <div class="avatar-wrap">
              <div id="avatar-placeholder" class="avatar avatar--placeholder" aria-hidden="true">Z</div>
              <img id="discord-avatar" class="avatar is-hidden" alt="" width="96" height="96" />
              <span id="status-dot" class="status-dot" role="img" aria-label="Discord status: offline"></span>
            </div>
            <div class="hero__identity">
              <p id="status-bubble" class="status-bubble" aria-live="polite" hidden></p>
              <h1 class="name">zephyn</h1>
            </div>
          </div>

          <p class="handles" id="handles"></p>

          <div class="pill-row">
            <span class="pill" id="followers-pill">
              <span id="followers-count">Loading&hellip;</span>
              <span>followers</span>
            </span>
            <span class="pill pill--time">
              <svg class="pill__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6" />
                <path d="M12 7.5V12L15 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
              <span id="local-time">--:--</span>
              <span class="pill__muted">for zephyn&nbsp;&middot;&nbsp;</span>
              <span id="time-offset" class="pill__muted"></span>
            </span>
          </div>
        </section>

        <div class="groups">
          <section class="group" aria-labelledby="group-socials-label">
            <p class="group__label" id="group-socials-label">
              Socials
              <span class="group__rule" aria-hidden="true"></span>
            </p>
            <div class="group__rows">
              <a class="row" id="card-roblox" href="#" target="_blank" rel="noopener noreferrer">
                <svg class="row__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <rect x="6" y="6" width="12" height="12" rx="2.5" transform="rotate(-8 12 12)" stroke="currentColor" stroke-width="1.6" />
                </svg>
                <span class="row__label">Roblox</span>
              </a>

              <a class="row" id="card-youtube" href="#" target="_blank" rel="noopener noreferrer">
                <svg class="row__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <rect x="3.5" y="6.5" width="17" height="11" rx="3.5" stroke="currentColor" stroke-width="1.6" />
                  <path d="M10.5 9.5L15 12L10.5 14.5V9.5Z" fill="currentColor" />
                </svg>
                <span class="row__label">YouTube</span>
              </a>

              <a class="row" id="card-tiktok" href="#" target="_blank" rel="noopener noreferrer">
                <svg class="row__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <circle cx="8.5" cy="17" r="2.5" stroke="currentColor" stroke-width="1.6" />
                  <path d="M11 17V6.5L17 5V13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
                  <circle cx="14.5" cy="13" r="2.5" stroke="currentColor" stroke-width="1.6" />
                </svg>
                <span class="row__label">TikTok</span>
              </a>
            </div>
          </section>
        </div>

        <div class="bottom-row">
          <span class="pill" id="views-pill" hidden>
            <svg class="pill__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M2.5 12C2.5 12 5.5 5.5 12 5.5C18.5 5.5 21.5 12 21.5 12C21.5 12 18.5 18.5 12 18.5C5.5 18.5 2.5 12 2.5 12Z"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linejoin="round"
              />
              <circle cx="12" cy="12" r="2.75" stroke="currentColor" stroke-width="1.6" />
            </svg>
            <span id="views-count">0</span>
            <span>views</span>
          </span>

          <footer class="footer">
            <p class="footer__pill">
              <span>&copy; zephyn</span>
              <span id="year"></span>
            </p>
          </footer>
        </div>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
