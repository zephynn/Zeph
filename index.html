<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="zephyn — Roblox developer. Links to Roblox, YouTube, and Discord." />
    <title>zephyn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=DM+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="page">
      <div class="blobs" aria-hidden="true">
        <div class="blob blob--a"></div>
        <div class="blob blob--b"></div>
        <div class="blob blob--c"></div>
      </div>

      <main class="content">
        <section class="hero">
          <div class="hero__top">
            <div class="avatar-wrap">
              <div id="avatar-placeholder" class="avatar avatar--placeholder" aria-hidden="true">Z</div>
              <img id="discord-avatar" class="avatar" alt="" width="96" height="96" hidden />
              <span id="status-dot" class="status-dot" role="img" aria-label="Discord status: offline"></span>
            </div>
            <p id="status-bubble" class="status-bubble" aria-live="polite" hidden></p>
          </div>

          <h1 class="name">zephyn</h1>
          <p class="handles" id="handles"></p>

          <div class="pill-row">
            <span class="pill" id="followers-pill">
              <span id="followers-count">Loading&hellip;</span>&nbsp;subscribers
            </span>
            <span class="pill pill--time">
              <svg class="pill__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6" />
                <path d="M12 7.5V12L15 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
              <span id="local-time">--:--</span>
              <span class="pill__muted">for zephyn&nbsp;&middot;&nbsp;</span>
              <span id="time-offset" class="pill__muted"></span>
            </span>
          </div>
        </section>

        <section class="cards" aria-label="Links">
          <a class="card" id="card-roblox" href="#" target="_blank" rel="noopener noreferrer">
            <span class="card__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="4" y="4" width="16" height="16" rx="3" transform="rotate(-8 12 12)" fill="currentColor" opacity="0.15" />
                <rect x="7" y="7" width="10" height="10" rx="2" transform="rotate(-8 12 12)" stroke="currentColor" stroke-width="1.8" />
              </svg>
            </span>
            <span class="card__body">
              <span class="card__title">Roblox</span>
              <span class="card__subtitle">@zephyn</span>
            </span>
            <svg class="card__arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M7 17L17 7M17 7H9M17 7V15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </a>

          <a class="card" id="card-youtube" href="#" target="_blank" rel="noopener noreferrer">
            <span class="card__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="3" y="6" width="18" height="12" rx="4" fill="currentColor" opacity="0.15" />
                <path d="M10.5 9.5L15 12L10.5 14.5V9.5Z" fill="currentColor" />
              </svg>
            </span>
            <span class="card__body">
              <span class="card__title">YouTube</span>
              <span class="card__subtitle">Videos &amp; devlogs</span>
            </span>
            <svg class="card__arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M7 17L17 7M17 7H9M17 7V15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </a>

          <div class="card" id="card-discord" aria-live="polite">
            <span class="card__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="9" fill="currentColor" opacity="0.15" />
                <circle cx="9" cy="12" r="1.4" fill="currentColor" />
                <circle cx="15" cy="12" r="1.4" fill="currentColor" />
                <path d="M8 15.5C9.2 16.4 10.5 16.8 12 16.8C13.5 16.8 14.8 16.4 16 15.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
              </svg>
            </span>
            <span class="card__body">
              <span class="card__title">Discord</span>
              <span class="card__subtitle" id="discord-status-text">Connecting&hellip;</span>
            </span>
          </div>
        </section>

        <footer class="footer">
          <p>&copy; <span id="year"></span> zephyn</p>
        </footer>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
